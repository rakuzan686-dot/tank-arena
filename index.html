<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Танковая Арена</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a12'/><rect x='15' y='40' width='70' height='30' fill='%23e94560' rx='5'/><circle cx='50' cy='30' r='15' fill='%23ff5577'/><rect x='45' y='28' width='35' height='8' fill='%23222'/></svg>">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; height: 100vh; }
    canvas { display: block; }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.95); color: #fff; z-index: 10; text-align: center; padding: 15px; }
    .overlay h1 { font-size: 24px; color: #e94560; letter-spacing: 2px; margin-bottom: 5px; }
    .overlay h2 { font-size: 11px; color: #888; margin-bottom: 15px; letter-spacing: 1px; }
    .overlay p { color: #bbb; font-size: 11px; margin-bottom: 12px; max-width: 320px; line-height: 1.5; }
    .btn { background: transparent; color: #e94560; border: 2px solid #e94560; padding: 10px 30px; font-size: 14px; font-family: inherit; letter-spacing: 2px; cursor: pointer; margin: 4px; }
    .btn:active { background: #e94560; color: #000; }
    .maps { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; justify-content: center; }
    .map-btn { background: transparent; color: #888; border: 2px solid #444; padding: 8px 12px; font-family: inherit; font-size: 11px; cursor: pointer; }
    .map-btn.active { color: #e94560; border-color: #e94560; }

    #hud { position: fixed; top: 8px; left: 8px; color: #fff; font-size: 11px; z-index: 5; text-shadow: 0 0 5px #000; }
    #hud .bar { width: 100px; height: 10px; background: #222; border: 1px solid #444; margin-top: 2px; }
    #hud .fill { height: 100%; background: #4CAF50; transition: width 0.2s; }

    #radar { position: fixed; top: 8px; right: 8px; width: 90px; height: 90px; background: rgba(5,10,5,0.85); border: 2px solid #4CAF50; border-radius: 50%; z-index: 5; }

    #killFeed { position: fixed; bottom: 8px; left: 8px; color: #fff; font-size: 10px; z-index: 5; text-shadow: 0 0 5px #000; max-width: 180px; }
    #killFeed div { margin-bottom: 2px; }

    #joyLeft { position: fixed; bottom: 15px; left: 15px; width: 110px; height: 110px; border-radius: 50%; background: rgba(233,69,96,0.15); border: 2px solid rgba(233,69,96,0.5); z-index: 5; }
    #joyLeft .stick { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(233,69,96,0.6); }

    #joyRight { position: fixed; bottom: 15px; right: 15px; width: 110px; height: 110px; border-radius: 50%; background: rgba(76,175,80,0.15); border: 2px solid rgba(76,175,80,0.5); z-index: 5; }
    #joyRight .stick { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(76,175,80,0.6); }

    #shootBtn { position: fixed; bottom: 135px; right: 25px; width: 65px; height: 65px; border-radius: 50%; background: rgba(233,69,96,0.5); border: 2px solid #e94560; color: #fff; font-size: 26px; z-index: 5; display: flex; align-items: center; justify-content: center; }
    #shootBtn:active { background: #e94560; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
    <div>❤️ HP: <span id="hpVal">100</span></div>
    <div class="bar"><div class="fill" id="hpBar" style="width:100%"></div></div>
    <div style="margin-top:4px;">💀 Убийств: <span id="killVal">0</span></div>
    <div style="margin-top:2px;">🏆 Место: <span id="placeVal">—</span></div>
</div>

<canvas id="radar" width="90" height="90"></canvas>
<div id="killFeed"></div>

<div id="joyLeft" style="display:none;"><div class="stick" id="stickL"></div></div>
<div id="joyRight" style="display:none;"><div class="stick" id="stickR"></div></div>
<div id="shootBtn" style="display:none;">💥</div>

<div class="overlay" id="menu">
    <h1>ТАНКОВАЯ АРЕНА</h1>
    <h2>BATTLE ROYALE</h2>
    <p>Уничтожай врагов. Последний выживший побеждает. Левый джойстик — движение, правый — прицел. Тапни по правой половине экрана — башня повернётся туда.</p>
    <div class="maps">
        <button class="map-btn active" data-map="0">🏜️ ПУСТЫНЯ</button>
        <button class="map-btn" data-map="1">🌲 ЛЕС</button>
        <button class="map-btn" data-map="2">🏙️ ГОРОД</button>
    </div>
    <button class="btn" id="startBtn">В БОЙ</button>
</div>

<div class="overlay" id="gameOver" style="display:none;">
    <h1 id="resultTitle" style="color:#e94560; font-size:22px;">ПОРАЖЕНИЕ</h1>
    <p id="resultText" style="font-size:13px;"></p>
    <button class="btn" id="restartBtn">ЗАНОВО</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const radarCanvas = document.getElementById('radar');
const rctx = radarCanvas.getContext('2d');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const WORLD_W = 2200, WORLD_H = 2200;
let gameState = 'menu';
let frame = 0;
let camera = { x: 0, y: 0 };
let selectedMap = 0;
let killFeed = [];

const MAPS = [
    { name: 'Пустыня', ground: '#3a2a1a', accent: '#5a4a2a', obstacleColor: '#8B7355' },
    { name: 'Лес', ground: '#1a3a1a', accent: '#2a5a2a', obstacleColor: '#3a5a3a' },
    { name: 'Город', ground: '#1a1a2a', accent: '#2a2a3a', obstacleColor: '#4a4a5a' }
];

let player = { x: 0, y: 0, angle: 0, turretAngle: 0, vx: 0, vy: 0, hp: 100, maxHp: 100, kills: 0, alive: true, radius: 22, color: '#e94560', reload: 0, isBot: false };
let bots = [];
let bullets = [];
let obstacles = [];
let particles = [];

let joyL = { active: false, dx: 0, dy: 0, id: null };
let joyR = { active: false, dx: 0, dy: 0, id: null };
let shootPressed = false;

const BOT_COUNT = 7;
const BOT_NAMES = ['Т-90', 'Абрамс', 'Леопард', 'Меркава', 'Челленджер', 'Т-34', 'КВ-2', 'Пантера', 'Тигр', 'ИС-7'];

function makeObstacles() {
    obstacles = [];
    let count = 18 + Math.floor(Math.random() * 8);
    for (let i = 0; i < count; i++) {
        let w = 60 + Math.random() * 100;
        let h = 60 + Math.random() * 100;
        let x = 100 + Math.random() * (WORLD_W - 200 - w);
        let y = 100 + Math.random() * (WORLD_H - 200 - h);
        obstacles.push({ x, y, w, h });
    }
}

function makeBot(index) {
    let x, y, ok, tries = 0;
    do {
        x = 100 + Math.random() * (WORLD_W - 200);
        y = 100 + Math.random() * (WORLD_H - 200);
        ok = Math.hypot(x - player.x, y - player.y) > 400;
        tries++;
    } while (!ok && tries < 50);
    return {
        x, y, angle: Math.random() * Math.PI * 2, turretAngle: 0,
        vx: 0, vy: 0, hp: 80, maxHp: 80, alive: true,
        radius: 22, color: '#4a4a8a', reload: 0,
        name: BOT_NAMES[index % BOT_NAMES.length],
        targetX: x, targetY: y, thinkTimer: 0, isBot: true
    };
}

function reset() {
    player.x = WORLD_W / 2;
    player.y = WORLD_H / 2;
    player.angle = 0; player.turretAngle = 0;
    player.vx = 0; player.vy = 0;
    player.hp = 100; player.kills = 0;
    player.alive = true; player.reload = 0;

    bots = [];
    for (let i = 0; i < BOT_COUNT; i++) bots.push(makeBot(i));
    bullets = [];
    particles = [];
    killFeed = [];
    frame = 0;

    makeObstacles();
    updateHUD();
}

function updateHUD() {
    document.getElementById('hpVal').textContent = Math.max(0, Math.floor(player.hp));
    document.getElementById('hpBar').style.width = Math.max(0, player.hp) + '%';
    document.getElementById('killVal').textContent = player.kills;
    let alive = bots.filter(b => b.alive).length + (player.alive ? 1 : 0);
    document.getElementById('placeVal').textContent = alive + '/' + (BOT_COUNT + 1);
}

function addKillFeed(text) {
    killFeed.push({ text, time: 180 });
    if (killFeed.length > 4) killFeed.shift();
    renderKillFeed();
}

function renderKillFeed() {
    let el = document.getElementById('killFeed');
    el.innerHTML = killFeed.map(k => `<div style="opacity:${k.time / 180}">${k.text}</div>`).join('');
}

function shoot(shooter, isPlayer) {
    if (shooter.reload > 0) return;
    let angle = shooter.turretAngle;
    let speed = 12;
    let bx = shooter.x + Math.cos(angle) * 30;
    let by = shooter.y + Math.sin(angle) * 30;
    bullets.push({
        x: bx, y: by,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        owner: shooter, isPlayer: isPlayer,
        life: 90, damage: 15
    });
    shooter.reload = isPlayer ? 20 : 45;
    shooter.vx -= Math.cos(angle) * 1.5;
    shooter.vy -= Math.sin(angle) * 1.5;
}

function collideObstacles(obj) {
    obstacles.forEach(o => {
        let cx = Math.max(o.x, Math.min(obj.x, o.x + o.w));
        let cy = Math.max(o.y, Math.min(obj.y, o.y + o.h));
        let dx = obj.x - cx, dy = obj.y - cy;
        let d = Math.hypot(dx, dy);
        if (d < obj.radius) {
            if (d === 0) { dx = 1; dy = 0; d = 1; }
            obj.x += (dx / d) * (obj.radius - d);
            obj.y += (dy / d) * (obj.radius - d);
            obj.vx *= 0.5; obj.vy *= 0.5;
        }
    });
}

function bulletCollidesObstacle(b) {
    return obstacles.some(o => b.x > o.x && b.x < o.x + o.w && b.y > o.y && b.y < o.y + o.h);
}

function update() {
    if (gameState !== 'playing') return;
    frame++;

    if (player.alive) {
        if (player.reload > 0) player.reload--;
        let speed = 3.5;
        player.vx += joyL.dx * 0.8;
        player.vy += joyL.dy * 0.8;
        player.vx *= 0.85; player.vy *= 0.85;
        let sp = Math.hypot(player.vx, player.vy);
        if (sp > speed) { player.vx = player.vx / sp * speed; player.vy = player.vy / sp * speed; }
        player.x += player.vx;
        player.y += player.vy;
        player.x = Math.max(30, Math.min(WORLD_W - 30, player.x));
        player.y = Math.max(30, Math.min(WORLD_H - 30, player.y));
        collideObstacles(player);
        if (sp > 0.3) player.angle = Math.atan2(player.vy, player.vx);
        if (joyR.active && (Math.abs(joyR.dx) > 0.05 || Math.abs(joyR.dy) > 0.05)) {
            player.turretAngle = Math.atan2(joyR.dy, joyR.dx);
        }
        if (shootPressed) shoot(player, true);
    }

    bots.forEach(b => {
        if (!b.alive) return;
        if (b.reload > 0) b.reload--;
        let nearest = null, nd = 99999;
        if (player.alive) {
            let d = Math.hypot(player.x - b.x, player.y - b.y);
            if (d < nd) { nd = d; nearest = player; }
        }
        bots.forEach(o => {
            if (o === b || !o.alive) return;
            let d = Math.hypot(o.x - b.x, o.y - b.y);
            if (d < nd) { nd = d; nearest = o; }
        });
        if (nearest && nd < 500) {
            b.turretAngle = Math.atan2(nearest.y - b.y, nearest.x - b.x);
            if (nd < 400 && b.reload <= 0 && Math.random() < 0.04) shoot(b, false);
            if (nd > 250) {
                b.vx += Math.cos(b.turretAngle) * 0.3;
                b.vy += Math.sin(b.turretAngle) * 0.3;
            } else if (nd < 150) {
                b.vx -= Math.cos(b.turretAngle) * 0.3;
                b.vy -= Math.sin(b.turretAngle) * 0.3;
            }
        } else {
            b.thinkTimer--;
            if (b.thinkTimer <= 0) {
                b.targetX = 100 + Math.random() * (WORLD_W - 200);
                b.targetY = 100 + Math.random() * (WORLD_H - 200);
                b.thinkTimer = 120 + Math.random() * 120;
            }
            let ang = Math.atan2(b.targetY - b.y, b.targetX - b.x);
            b.vx += Math.cos(ang) * 0.15;
            b.vy += Math.sin(ang) * 0.15;
            b.turretAngle = ang;
        }
        b.vx *= 0.9; b.vy *= 0.9;
        let bs = Math.hypot(b.vx, b.vy);
        if (bs > 2.5) { b.vx = b.vx / bs * 2.5; b.vy = b.vy / bs * 2.5; }
        b.x += b.vx; b.y += b.vy;
        b.x = Math.max(30, Math.min(WORLD_W - 30, b.x));
        b.y = Math.max(30, Math.min(WORLD_H - 30, b.y));
        collideObstacles(b);
    });

    bullets.forEach((bl, i) => {
        bl.x += bl.vx; bl.y += bl.vy; bl.life--;
        if (bl.life <= 0 || bl.x < 0 || bl.x > WORLD_W || bl.y < 0 || bl.y > WORLD_H) { bullets.splice(i, 1); return; }
        if (bulletCollidesObstacle(bl)) {
            for (let k = 0; k < 6; k++) particles.push({ x: bl.x, y: bl.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 15, color: '#aaa' });
            bullets.splice(i, 1); return;
        }
        if (!bl.isPlayer && player.alive && Math.hypot(bl.x - player.x, bl.y - player.y) < player.radius) {
            player.hp -= bl.damage;
            for (let k = 0; k < 10; k++) particles.push({ x: bl.x, y: bl.y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, life: 25, color: '#e94560' });
            if (player.hp <= 0) { player.hp = 0; player.alive = false; addKillFeed('💀 Тебя уничтожили'); }
            bullets.splice(i, 1); return;
        }
        for (let b of bots) {
            if (!b.alive || b === bl.owner) continue;
            if (Math.hypot(bl.x - b.x, bl.y - b.y) < b.radius) {
                b.hp -= bl.damage;
                for (let k = 0; k < 8; k++) particles.push({ x: bl.x, y: bl.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 20, color: b.color });
                if (b.hp <= 0) {
                    b.alive = false;
                    if (bl.isPlayer) { player.kills++; addKillFeed('💥 Ты уничтожил ' + b.name); }
                    else addKillFeed('💥 ' + bl.owner.name + ' → ' + b.name);
                }
                bullets.splice(i, 1); return;
            }
        }
    });

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.92; p.vy *= 0.92;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    });

    camera.x = Math.max(0, Math.min(WORLD_W - W, player.x - W/2));
    camera.y = Math.max(0, Math.min(WORLD_H - H, player.y - H/2));

    let aliveBots = bots.filter(b => b.alive).length;
    if (!player.alive) {
        gameState = 'over';
        showResult('ПОРАЖЕНИЕ', 'Убийств: ' + player.kills);
    } else if (aliveBots === 0) {
        gameState = 'over';
        showResult('ПОБЕДА!', 'Убийств: ' + player.kills);
    }

    killFeed.forEach(k => k.time--);
    killFeed = killFeed.filter(k => k.time > 0);
    if (frame % 10 === 0) renderKillFeed();
    if (frame % 15 === 0) updateHUD();
}

function showResult(title, text) {
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultText').textContent = text;
    document.getElementById('gameOver').style.display = 'flex';
    document.getElementById('joyLeft').style.display = 'none';
    document.getElementById('joyRight').style.display = 'none';
    document.getElementById('shootBtn').style.display = 'none';
}

function drawTank(x, y, angle, turretAngle, color, isPlayer, name) {
    ctx.save();
    ctx.translate(x, y);
    ctx.save();
    ctx.rotate(angle);
    ctx.fillStyle = '#111';
    ctx.fillRect(-24, -20, 48, 8);
    ctx.fillRect(-24, 12, 48, 8);
    ctx.fillStyle = '#333';
    for (let i = -22; i < 22; i += 6) {
        ctx.fillRect(i, -20, 3, 8);
        ctx.fillRect(i, 12, 3, 8);
    }
    ctx.fillStyle = color;
    ctx.fillRect(-22, -13, 44, 26);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-22, -13, 44, 5);
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 2;
    ctx.strokeRect(-22, -13, 44, 26);
    ctx.restore();

    ctx.save();
    ctx.rotate(turretAngle);
    ctx.fillStyle = isPlayer ? '#ff5577' : '#5a5a9a';
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(0, -3, 38, 6);
    ctx.fillStyle = '#444';
    ctx.fillRect(32, -4, 8, 8);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(38, -4, 3, 8);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(-4, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = isPlayer ? '#e94560' : '#fff';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;
    ctx.fillText(name, 0, -36);
    ctx.shadowBlur = 0;
    ctx.restore();
}

function draw() {
    let m = MAPS[selectedMap];
    ctx.fillStyle = m.ground;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    ctx.fillStyle = m.ground;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    ctx.strokeStyle = m.accent;
    ctx.globalAlpha = 0.3;
    for (let x = 0; x < WORLD_W; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); ctx.stroke(); }
    for (let y = 0; y < WORLD_H; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke(); }
    ctx.globalAlpha = 1;

    obstacles.forEach(o => {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(o.x + 4, o.y + 4, o.w, o.h);
        ctx.fillStyle = m.obstacleColor;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(o.x, o.y, o.w, 6);
    });

    bullets.forEach(b => {
        ctx.fillStyle = b.isPlayer ? '#ffff00' : '#ff8800';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,0,0.3)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
        ctx.fill();
    });

    particles.forEach(p => {
        ctx.globalAlpha = p.life / 25;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;

    bots.forEach(b => {
        if (!b.alive) return;
        drawTank(b.x, b.y, b.angle, b.turretAngle, b.color, false, b.name);
        ctx.fillStyle = '#400';
        ctx.fillRect(b.x - 22, b.y - 52, 44, 5);
        ctx.fillStyle = '#0f0';
        ctx.fillRect(b.x - 22, b.y - 52, 44 * (b.hp / b.maxHp), 5);
    });

    if (player.alive) {
        drawTank(player.x, player.y, player.angle, player.turretAngle, player.color, true, 'ТЫ');
    }

    ctx.restore();

    rctx.clearRect(0, 0, 90, 90);
    rctx.fillStyle = 'rgba(5,10,5,0.9)';
    rctx.beginPath(); rctx.arc(45, 45, 45, 0, Math.PI*2); rctx.fill();
    rctx.strokeStyle = '#4CAF50';
    rctx.lineWidth = 2;
    rctx.beginPath(); rctx.arc(45, 45, 43, 0, Math.PI*2); rctx.stroke();
    rctx.beginPath(); rctx.arc(45, 45, 29, 0, Math.PI*2); rctx.stroke();
    rctx.beginPath(); rctx.arc(45, 45, 15, 0, Math.PI*2); rctx.stroke();
    rctx.beginPath(); rctx.moveTo(45, 2); rctx.lineTo(45, 88); rctx.stroke();
    rctx.beginPath(); rctx.moveTo(2, 45); rctx.lineTo(88, 45); rctx.stroke();

    let range = 800;
    bots.forEach(b => {
        if (!b.alive) return;
        let dx = b.x - player.x, dy = b.y - player.y;
        let d = Math.hypot(dx, dy);
        if (d > range) return;
        let rx = 45 + (dx / range) * 41;
        let ry = 45 + (dy / range) * 41;
        rctx.fillStyle = '#ff4444';
        rctx.beginPath(); rctx.arc(rx, ry, 3, 0, Math.PI*2); rctx.fill();
    });

    rctx.fillStyle = '#4CAF50';
    rctx.beginPath(); rctx.arc(45, 45, 4, 0, Math.PI*2); rctx.fill();
    rctx.strokeStyle = '#4CAF50';
    rctx.lineWidth = 2;
    rctx.beginPath();
    rctx.moveTo(45, 45);
    rctx.lineTo(45 + Math.cos(player.turretAngle) * 12, 45 + Math.sin(player.turretAngle) * 12);
    rctx.stroke();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function setupJoystick(el, joy, isAim) {
    function start(e) {
        e.preventDefault();
        joy.active = true;
        joy.id = e.touches ? e.touches[0].identifier : 'mouse';
        if (isAim) {
            let touch = e.touches ? e.touches[0] : e;
            let rect = el.getBoundingClientRect();
            let cx = rect.left + rect.width / 2;
            let cy = rect.top + rect.height / 2;
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            if (Math.hypot(dx, dy) > 5) {
                joy.dx = dx / Math.hypot(dx, dy);
                joy.dy = dy / Math.hypot(dx, dy);
            } else {
                joy.dx = 1; joy.dy = 0;
            }
        }
        move(e);
    }
    function move(e) {
        if (!joy.active) return;
        e.preventDefault();
        let touch = e.touches ? Array.from(e.touches).find(t => t.identifier === joy.id) : e;
        if (!touch) return;
        let rect = el.getBoundingClientRect();
        let cx = rect.left + rect.width / 2;
        let cy = rect.top + rect.height / 2;
        let dx = touch.clientX - cx;
        let dy = touch.clientY - cy;
        let d = Math.hypot(dx, dy);
        let maxD = rect.width / 2 - 12;
        if (d > maxD) { dx = dx / d * maxD; dy = dy / d * maxD; d = maxD; }
        if (d < 8 && isAim) return;
        joy.dx = dx / maxD;
        joy.dy = dy / maxD;
        let stick = el.querySelector('.stick');
        stick.style.transform = `translate(${dx}px, ${dy}px)`;
    }
    function end(e) {
        joy.active = false; joy.dx = 0; joy.dy = 0; joy.id = null;
        let stick = el.querySelector('.stick');
        stick.style.transform = 'translate(0, 0)';
    }
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchmove', move, { passive: false });
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
    el.addEventListener('mousedown', start);
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', end);
}

setupJoystick(document.getElementById('joyLeft'), joyL, false);
setupJoystick(document.getElementById('joyRight'), joyR, true);

let shootEl = document.getElementById('shootBtn');
shootEl.addEventListener('touchstart', e => { e.preventDefault(); shootPressed = true; });
shootEl.addEventListener('touchend', e => { e.preventDefault(); shootPressed = false; });
shootEl.addEventListener('mousedown', e => { e.preventDefault(); shootPressed = true; });
shootEl.addEventListener('mouseup', () => { shootPressed = false; });
shootEl.addEventListener('mouseleave', () => { shootPressed = false; });

let keys = {};
document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') shootPressed = true;
    if (e.key.startsWith('Arrow')) e.preventDefault();
});
document.addEventListener('keyup', e => {
    keys[e.key] = false;
    if (e.key === ' ') shootPressed = false;
});

// Тап по правой половине экрана = прицел
canvas.addEventListener('touchstart', (e) => {
    if (gameState !== 'playing' || !player.alive) return;
    for (let touch of e.changedTouches) {
        if (touch.clientX > W / 2) {
            let dx = touch.clientX - W / 2;
            let dy = touch.clientY - H / 2;
            if (Math.hypot(dx, dy) > 20) {
                player.turretAngle = Math.atan2(dy, dx);
            }
        }
    }
});

const origUpdate = update;
update = function() {
    if (gameState === 'playing' && player.alive) {
        if (!joyL.active) {
            joyL.dx = 0; joyL.dy = 0;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) joyL.dy = -1;
            if (keys['s'] || keys['S'] || keys['ArrowDown']) joyL.dy = 1;
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) joyL.dx = -1;
            if (keys['d'] || keys['D'] || keys['ArrowRight']) joyL.dx = 1;
        }
        if (!joyR.active) {
            if (keys['ArrowUp']) joyR.dy = -1;
            if (keys['ArrowDown']) joyR.dy = 1;
            if (keys['ArrowLeft']) joyR.dx = -1;
            if (keys['ArrowRight']) joyR.dx = 1;
        }
    }
    origUpdate();
};

document.querySelectorAll('.map-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMap = parseInt(btn.dataset.map);
    };
});

document.getElementById('startBtn').onclick = () => {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('joyLeft').style.display = 'block';
    document.getElementById('joyRight').style.display = 'block';
    document.getElementById('shootBtn').style.display = 'flex';
    gameState = 'playing';
    reset();
};

document.getElementById('restartBtn').onclick = () => {
    document.getElementById('gameOver').style.display = 'none';
    document.getElementById('joyLeft').style.display = 'block';
    document.getElementById('joyRight').style.display = 'block';
    document.getElementById('shootBtn').style.display = 'flex';
    gameState = 'playing';
    reset();
};

reset();
loop();
</script>
